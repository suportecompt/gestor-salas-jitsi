<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Login Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-6 sm:p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/60 w-[95%] max-w-sm text-center border border-slate-100">
        
        <div class="mb-6 flex justify-center">
            <img src="logo.png" alt="Logo Empresa" class="h-14 sm:h-16 w-auto object-contain">
        </div>

        <div class="mb-8">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2 leading-tight">Painel do Técnico</h1>
            <p class="text-xs sm:text-sm text-slate-500 font-medium italic">Introduza as suas credenciais</p>
        </div>

        <form id="admin-login-form" class="flex flex-col gap-4">
            <input type="email" id="admin-email" placeholder="Email profissional" required 
                class="w-full px-5 py-3.5 sm:py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:border-blue-500 focus:bg-white outline-none transition-all text-slate-700">

            <input type="password" id="admin-password" placeholder="Palavra-passe" required 
                class="w-full px-5 py-3.5 sm:py-4 rounded-2xl bg-slate-50 border border-slate-100 focus:border-blue-500 focus:bg-white outline-none transition-all text-slate-700">
            
            <button type="submit" class="flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 sm:py-4 px-4 rounded-2xl transition-all active:scale-[0.97] shadow-lg shadow-blue-100 mt-2">
                <i data-lucide="shield-check" class="w-5 h-5 flex-shrink-0 opacity-90"></i>
                <span class="text-base sm:text-lg">Entrar no sistema</span>
            </button>
        </form>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="main.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
